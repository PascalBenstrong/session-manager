[package]
name = "session-manager"
version = "0.8.0"
edition = "2024"
description = "Tab session manager and site-data cleaner browser extension (Rust + egui + WebAssembly)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex-lite = "0.1"
roxmltree = "0.21.2"

# Everything that talks to the browser (background logic, egui UI) only builds for wasm.
# The pure core (model, search, organize, cleanup matching, state) builds and tests natively.
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.37"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Storage", "console"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
