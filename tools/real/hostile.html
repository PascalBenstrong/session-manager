<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hostile test page</title>
    <!-- A page that does what the page guards defend against, for tools/real-browser-test.mjs.
         ?notrap: skip the debugger trap (it would freeze an unguarded page with the developer tools open).
         ?static: also load trap.js, a script file with a literal debugger statement (Firefox filter). -->
    <script src="ad-script.js"></script>
    <script>
      window.report = { adScript: !!window.__adScript, popups: [], playPopups: [], contextMenus: 0, detections: [], ticks: 0 };
      const params = new URLSearchParams(location.search);
      if (params.has('static')) document.write('<script src="trap.js"><\/script>');

      // Pop-under: any click anywhere opens an ad.
      document.addEventListener('click', () => {
        const w = window.open('http://localhost:8123/tools/real/ad.html?popunder', '_blank');
        report.popups.push(w ? 'opened' : 'blocked');
      });
      // No right-click.
      document.addEventListener('contextmenu', (e) => {
        report.contextMenus++;
        e.preventDefault();
      });

      // Developer tools detection, three classic ways.
      const detect = (how) => report.detections.includes(how) || report.detections.push(how);
      setInterval(() => {
        report.ticks++;
        if (window.outerWidth - window.innerWidth > 160 || window.outerHeight - window.innerHeight > 200) detect('window size');
        const bait = new Image();
        Object.defineProperty(bait, 'id', { get: () => detect('console getter') });
        console.log(bait);
        console.clear();
        if (!params.has('notrap')) {
          const t = performance.now();
          Function('debugger')();
          if (performance.now() - t > 100) detect('debugger timing');
        }
      }, 300);
    </script>
    <style>
      body { font: 16px system-ui; margin: 40px; user-select: none; }
      #space { height: 300px; background: #eef; }
    </style>
  </head>
  <body>
    <h1>Hostile test page</h1>
    <p><a id="adlink" href="http://localhost:8123/tools/real/ad.html?link" target="_blank">A link to an ad site</a></p>
    <div id="space">Click anywhere here.</div>
    <video src="https://example.com/clip.mp4" muted></video>
    <iframe src="ad.html?frame" title="ad frame" width="200" height="60"></iframe>
    <!-- "Press play, get an ad": an invisible layer over the player opens an ad tab. -->
    <div id="player" style="position: relative; width: 320px; height: 180px">
      <video id="vid" muted style="width: 100%; height: 100%; background: #000"></video>
      <div id="hijack" style="position: absolute; inset: 0"></div>
    </div>
    <p>Data loads: <span id="xhrCount">0</span> · socket messages: <span id="wsCount">0</span></p>
    <script>
      // Network activity for the inspector's Network view: an XHR whose handler changes the
      // page (a replay must change it again), and a WebSocket (tools/serve.mjs /ws).
      function loadData(tag = 'load') {
        const x = new XMLHttpRequest();
        x.open('GET', `data.json?${tag}`);
        x.onload = function () {
          const out = document.getElementById('xhrCount');
          out.textContent = String(+out.textContent + JSON.parse(this.responseText).n);
        };
        x.send();
      }
      loadData();
      window.testWs = new WebSocket(`ws://${location.host}/ws`);
      testWs.addEventListener('message', () => {
        const out = document.getElementById('wsCount');
        out.textContent = String(+out.textContent + 1);
      });
    </script>
    <ins class="adsbygoogle" style="display: block; width: 300px; height: 50px; background: #ffe">ad slot</ins>
    <script>
      document.getElementById('hijack').addEventListener('click', () => {
        const w = window.open('http://localhost:8123/tools/real/ad.html?play', '_blank');
        report.playPopups.push(w ? 'opened' : 'blocked');
      });
    </script>
  </body>
</html>
